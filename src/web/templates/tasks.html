{% extends "base.html" %}

{% block title %}Tasks — Nexus{% endblock %}

{% block content %}
<h1>Tasks</h1>

<ul>
    {% for task in tasks %}
    <li>
        <a href="{{ url_for('pages.task_detail', task_id=task.id) }}">{{ task.title }}</a>
        — {{ task.state.name }}
    </li>
    {% else %}
    <li>No tasks yet.</li>
    {% endfor %}
</ul>
{% endblock %}
