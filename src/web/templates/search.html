{% extends "base.html" %}

{% block title %}Search — Nexus{% endblock %}

{% block content %}
<h1>Search</h1>

<form method="get" action="{{ url_for('pages.search') }}">
    <label>Query <input type="text" name="q" value="{{ term }}"></label>
    <button type="submit">Search</button>
</form>

<ul>
    {% for task in tasks %}
    <li>
        <a href="{{ url_for('pages.task_detail', task_id=task.id) }}">{{ task.title }}</a>
        — {{ task.state.name }}
    </li>
    {% else %}
    {% if term %}
    <li>No results.</li>
    {% endif %}
    {% endfor %}
</ul>
{% endblock %}
