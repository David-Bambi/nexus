<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c4630"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#fcfaf5"/>

  <!-- Three adapters on top -->
  <rect x="60" y="40" width="220" height="100" rx="12" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="170" y="96" text-anchor="middle" fill="#1f3a93" font-weight="bold">Web</text>
  <rect x="370" y="40" width="220" height="100" rx="12" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="480" y="96" text-anchor="middle" fill="#1f3a93" font-weight="bold">CLI</text>
  <rect x="680" y="40" width="220" height="100" rx="12" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="790" y="96" text-anchor="middle" fill="#1f3a93" font-weight="bold">MCP</text>

  <!-- Import: annex shared by CLI and MCP -->
  <rect x="560" y="190" width="150" height="70" rx="10" fill="#e6f0dc" stroke="#4f7a3a" stroke-width="2"/>
  <text x="635" y="231" text-anchor="middle" fill="#4f7a3a" font-weight="bold">Import</text>

  <!-- Services: shared layer at the bottom -->
  <rect x="60" y="320" width="840" height="110" rx="12" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="480" y="381" text-anchor="middle" fill="#1f3a93" font-weight="bold">Services</text>

  <!-- Flows: adapters call services -->
  <line x1="170" y1="142" x2="170" y2="318" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="440" y1="142" x2="440" y2="318" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="830" y1="142" x2="830" y2="318" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="530" y1="142" x2="590" y2="188" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="740" y1="142" x2="680" y2="188" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="635" y1="262" x2="635" y2="318" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
