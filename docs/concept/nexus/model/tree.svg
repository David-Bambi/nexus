<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="sans-serif" font-size="16">
  <!-- Arbre de travail : projet, sous-projet, fonctionnalités emboîtées, tâches, capture hors arbre. -->
  <rect width="960" height="460" fill="#fcfaf5"/>

  <!-- Sous-projet et son propre arbre -->
  <rect x="600" y="130" width="300" height="320" rx="14" fill="none" stroke="#8c5a3c" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Liens parent-enfant -->
  <g stroke="#5c4630" stroke-width="2" fill="none">
    <line x1="480" y1="86" x2="160" y2="150"/>
    <line x1="480" y1="86" x2="400" y2="150"/>
    <line x1="480" y1="86" x2="750" y2="150"/>
    <line x1="160" y1="206" x2="120" y2="280"/>
    <line x1="160" y1="206" x2="320" y2="280"/>
    <line x1="120" y1="336" x2="120" y2="390"/>
    <line x1="750" y1="206" x2="750" y2="280"/>
    <line x1="750" y1="336" x2="750" y2="390"/>
  </g>

  <!-- Projet racine -->
  <rect x="380" y="30" width="200" height="56" rx="10" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" fill="#1f3a93" font-weight="bold">Projet</text>

  <!-- Fonctionnalités -->
  <g fill="#e3ebff" stroke="#1f3a93" stroke-width="2">
    <rect x="60" y="150" width="200" height="56" rx="10"/>
    <rect x="20" y="280" width="200" height="56" rx="10"/>
    <rect x="650" y="280" width="200" height="56" rx="10"/>
  </g>
  <g fill="#1f3a93" font-weight="bold" text-anchor="middle">
    <text x="160" y="184">Fonctionnalité</text>
    <text x="120" y="314">Fonctionnalité</text>
    <text x="750" y="314">Fonctionnalité</text>
  </g>

  <!-- Sous-projet -->
  <rect x="650" y="150" width="200" height="56" rx="10" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="750" y="184" text-anchor="middle" fill="#1f3a93" font-weight="bold">Sous-projet</text>

  <!-- Tâches : des feuilles -->
  <g fill="#e6f0dc" stroke="#4f7a3a" stroke-width="2">
    <rect x="345" y="155" width="110" height="46" rx="10"/>
    <rect x="265" y="285" width="110" height="46" rx="10"/>
    <rect x="65" y="390" width="110" height="46" rx="10"/>
    <rect x="695" y="390" width="110" height="46" rx="10"/>
  </g>
  <g fill="#4f7a3a" font-weight="bold" text-anchor="middle">
    <text x="400" y="184">Tâche</text>
    <text x="320" y="314">Tâche</text>
    <text x="120" y="419">Tâche</text>
    <text x="750" y="419">Tâche</text>
  </g>

  <!-- Capture : hors de l'arbre, sans projet -->
  <circle cx="470" cy="365" r="32" fill="#fffaf0" stroke="#5c4630" stroke-width="2"/>
  <text x="470" y="375" text-anchor="middle" fill="#5c4630" font-size="30" font-weight="bold">?</text>
  <text x="470" y="425" text-anchor="middle" fill="#5c4630" font-weight="bold">Capture</text>
</svg>
