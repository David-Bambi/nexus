<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="sans-serif" font-size="16">
  <!-- États d'un élément et passages permis. Le cadre regroupe les états ouverts. -->
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c4630"/>
    </marker>
    <marker id="fleche-retour" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#fcfaf5"/>

  <!-- États ouverts -->
  <rect x="25" y="40" width="635" height="265" rx="14" fill="none" stroke="#8c5a3c" stroke-width="2" stroke-dasharray="8 6"/>

  <g fill="#e3ebff" stroke="#1f3a93" stroke-width="2">
    <rect x="50" y="60" width="130" height="50" rx="10"/>
    <rect x="270" y="60" width="130" height="50" rx="10"/>
    <rect x="490" y="60" width="130" height="50" rx="10"/>
    <rect x="150" y="220" width="130" height="50" rx="10"/>
    <rect x="490" y="220" width="130" height="50" rx="10"/>
  </g>
  <g fill="#1f3a93" font-weight="bold" text-anchor="middle">
    <text x="115" y="91">inbox</text>
    <text x="335" y="91">refined</text>
    <text x="555" y="91">doing</text>
    <text x="215" y="251">someday</text>
    <text x="555" y="251">waiting</text>
  </g>

  <!-- États fermés -->
  <g fill="#fffaf0" stroke="#5c4630" stroke-width="2">
    <rect x="760" y="60" width="130" height="50" rx="10"/>
    <rect x="760" y="340" width="130" height="50" rx="10"/>
  </g>
  <g fill="#5c4630" font-weight="bold" text-anchor="middle">
    <text x="825" y="91">done</text>
    <text x="825" y="371">cancelled</text>
  </g>

  <!-- Passages -->
  <g stroke="#5c4630" stroke-width="2" fill="none" marker-end="url(#fleche)">
    <line x1="180" y1="76" x2="268" y2="76"/>
    <line x1="400" y1="76" x2="488" y2="76"/>
    <line x1="620" y1="85" x2="758" y2="85"/>
    <line x1="540" y1="110" x2="540" y2="218"/>
    <line x1="570" y1="220" x2="570" y2="112"/>
    <line x1="100" y1="110" x2="178" y2="218"/>
    <line x1="315" y1="110" x2="240" y2="218"/>
    <line x1="265" y1="220" x2="340" y2="112"/>
    <line x1="660" y1="300" x2="758" y2="358"/>
  </g>

  <!-- Retours : désaffiner, défaire le démarrage, rouvrir, restaurer -->
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#fleche-retour)">
    <line x1="268" y1="96" x2="182" y2="96"/>
    <line x1="488" y1="96" x2="402" y2="96"/>
    <line x1="490" y1="232" x2="396" y2="113"/>
    <path d="M825,58 C825,8 555,8 555,58"/>
    <path d="M825,392 C825,450 380,450 380,112"/>
  </g>
</svg>
