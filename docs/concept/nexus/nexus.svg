<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c4630"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#fcfaf5"/>

  <!-- Interfaces: top band -->
  <rect x="250" y="20" width="420" height="100" rx="14" fill="none" stroke="#8c5a3c" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="460" y="76" text-anchor="middle" fill="#8c5a3c" font-weight="bold">Interfaces</text>

  <!-- Modèle: centre -->
  <rect x="300" y="175" width="320" height="100" rx="12" fill="#e3ebff" stroke="#1f3a93" stroke-width="2"/>
  <text x="460" y="231" text-anchor="middle" fill="#1f3a93" font-weight="bold">Modèle</text>

  <!-- Journal: annex to the right of the model -->
  <rect x="680" y="190" width="150" height="70" rx="10" fill="#e6f0dc" stroke="#4f7a3a" stroke-width="2"/>
  <text x="755" y="231" text-anchor="middle" fill="#4f7a3a" font-weight="bold">Journal</text>

  <!-- Mesure: output pile, far right -->
  <g fill="#fffaf0" stroke="#5c4630" stroke-width="2">
    <rect x="876" y="300" width="56" height="70" rx="4"/>
    <rect x="868" y="308" width="56" height="70" rx="4"/>
    <rect x="860" y="316" width="56" height="70" rx="4"/>
  </g>
  <text x="890" y="415" text-anchor="middle" fill="#5c4630" font-weight="bold">Mesure</text>

  <!-- Exploitation: bottom band -->
  <rect x="250" y="330" width="420" height="105" rx="14" fill="none" stroke="#8c5a3c" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="460" y="389" text-anchor="middle" fill="#8c5a3c" font-weight="bold">Exploitation</text>

  <!-- Guides and Outils IA: left column, aside -->
  <rect x="30" y="110" width="160" height="80" rx="10" fill="#fffaf0" stroke="#c9b99a" stroke-width="2"/>
  <text x="110" y="156" text-anchor="middle" fill="#5c4630" font-weight="bold">Guides</text>
  <rect x="30" y="260" width="160" height="80" rx="10" fill="#fffaf0" stroke="#c9b99a" stroke-width="2"/>
  <text x="110" y="306" text-anchor="middle" fill="#5c4630" font-weight="bold">Outils IA</text>

  <!-- Flows -->
  <line x1="460" y1="122" x2="460" y2="173" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="620" y1="225" x2="678" y2="225" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <path d="M830,240 C870,250 885,270 888,296" fill="none" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="460" y1="277" x2="460" y2="328" stroke="#5c4630" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
